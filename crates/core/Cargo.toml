[package]
name = "classets-core"
description = "CLASSETS sync engine: local index, change detection, transfers and direct sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
hex = "0.4.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
notify = "8.2.1"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs", "time", "sync", "macros"] }
unicode-normalization = "0.1.26"
walkdir = "2.5.1"

[features]
keyring = ["dep:keyring"]

[dev-dependencies]
clap = { version = "4.6.10", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
wiremock = "0.6.5"
