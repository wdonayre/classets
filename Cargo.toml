[workspace]
resolver = "3"
members = ["src-tauri", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["wdonayre"]
repository = "https://github.com/wdonayre/classets"
rust-version = "1.85"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
